name: Validate poetry content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Network-independent content checks
        run: npm run verify:offline
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Production build and Sites tests
        run: npm run build
